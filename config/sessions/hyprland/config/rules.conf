# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ WINDOW & LAYER RULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ─────────────────────────────
# Layer rules (OSD / overlays)
# ─────────────────────────────
layerrule = noanim, ^(volume_osd)$
layerrule = noanim, ^(brightness_osd)$
layerrule = noanim, hyprpicker
layerrule = noanim, qsdock
layerrule = blur, ext-session-lock
layerrule = ignorealpha 0.2, ext-session-lock

# ─────────────────────────────
# Window rules
# ─────────────────────────────


# ───────── App Launcher ─────────
windowrulev2 = float, title:^(app-launcher)$
windowrulev2 = center, title:^(app-launcher)$
windowrulev2 = size 1200 600, title:^(app-launcher)$
windowrulev2 = animation slide, title:^(app-launcher)$

# ───────── MASTER QUICKSHELL CONTAINER ─────────
# All widgets now live inside this single, shape-shifting window.
# windowrulev2 = float, title:^(qs-master)$
# windowrulev2 = noshadow, title:^(qs-master)$
# windowrulev2 = noborder, title:^(qs-master)$
# windowrulev2 = noinitialfocus, title:^(qs-master)$
#
#

workspace = 9, monitor:HDMI-A-1
workspace = special,monitor:DP-2
workspace = 1, monitor:DP-2
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2


# --------------------------
# Workspaces / App placement
# --------------------------
windowrulev2 = workspace 9, title:^(Clock)$
windowrulev2 = workspace 9, class:^(discord-canary)$
windowrulev2 = workspace 3, class:^(librewolf)$
windowrulev2 = workspace 2 silent, class:^(steam)$
windowrulev2 = workspace 9, class:^(discord)$
windowrulev2 = workspace 9, class:^(vesktop)$
windowrulev2 = workspace 5, class:^(com\.obsproject\.Studio)$

# Claude (PWA)
windowrulev2 = workspace special:claude silent, class:^(chrome-claude\.ai__-Default)$
windowrulev2 = monitor DP-2, class:^(chrome-claude\.ai__-Default)$
windowrulev2 = float, class:^(chrome-claude\.ai__-Default)$
windowrulev2 = size 1200 800, class:^(chrome-claude\.ai__-Default)$
windowrulev2 = center, class:^(chrome-claude\.ai__-Default)$
windowrulev2 = noanim, class:^(chrome-claude\.ai__-Default)$
windowrulev2 = noblur, class:^(chrome-claude\.ai__-Default)$

# WhatsApp (PWA)
windowrulev2 = workspace special:whatsapp silent, class:^(chrome-web\.whatsapp\.com__-Default)$
windowrulev2 = monitor DP-2, class:^(chrome-web\.whatsapp\.com__-Default)$
windowrulev2 = float, class:^(chrome-web\.whatsapp\.com__-Default)$
windowrulev2 = size 1000 700, class:^(chrome-web\.whatsapp\.com__-Default)$
windowrulev2 = center, class:^(chrome-web\.whatsapp\.com__-Default)$
windowrulev2 = noanim, class:^(chrome-web\.whatsapp\.com__-Default)$
windowrulev2 = noblur, class:^(chrome-web\.whatsapp\.com__-Default)$

# SoundCloud (PWA)
windowrulev2 = workspace special:soundcloud silent, class:^(chrome-soundcloud\.com__-Default)$
windowrulev2 = monitor DP-2, class:^(chrome-soundcloud\.com__-Default)$
windowrulev2 = float, class:^(chrome-soundcloud\.com__-Default)$
windowrulev2 = size 1200 800, class:^(chrome-soundcloud\.com__-Default)$
windowrulev2 = center, class:^(chrome-soundcloud\.com__-Default)$
windowrulev2 = noanim, class:^(chrome-soundcloud\.com__-Default)$
windowrulev2 = noblur, class:^(chrome-soundcloud\.com__-Default)$

# Scratchpad Terminal
windowrulev2 = workspace special:term silent, class:^(ScratchpadTerm)$
windowrulev2 = float, class:^(ScratchpadTerm)$
windowrulev2 = size 1400 800, class:^(ScratchpadTerm)$
windowrulev2 = center, class:^(ScratchpadTerm)$
windowrulev2 = noanim, class:^(ScratchpadTerm)$

# Pavucontrol
windowrulev2 = workspace special:pavu silent, class:^(org\.pulseaudio\.pavucontrol)$
windowrulev2 = float, class:^(org\.pulseaudio\.pavucontrol)$
windowrulev2 = size 1000 700, class:^(org\.pulseaudio\.pavucontrol)$
windowrulev2 = center, class:^(org\.pulseaudio\.pavucontrol)$
windowrulev2 = noanim, class:^(org\.pulseaudio\.pavucontrol)$

# Aonsoku
windowrulev2 = workspace special:aonsoku silent, class:^(Aonsoku)$
windowrulev2 = monitor DP-2, class:^(Aonsoku)$
windowrulev2 = float, class:^(Aonsoku)$
windowrulev2 = size 1200 900, class:^(Aonsoku)$
windowrulev2 = center, class:^(Aonsoku)$
windowrulev2 = noanim, class:^(Aonsoku)$
windowrulev2 = noblur, class:^(Aonsoku)$

