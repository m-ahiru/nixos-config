# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ WINDOW & LAYER RULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ─────────────────────────────
# Layer rules (OSD / overlays)
# ─────────────────────────────
layerrule = match:namespace ^(volume_osd)$, no_anim on
layerrule = match:namespace ^(brightness_osd)$, no_anim on
layerrule = match:namespace hyprpicker, no_anim on
layerrule = match:namespace qsdock, no_anim on
layerrule = match:namespace ext-session-lock, blur on, ignore_alpha 0.2

# ─────────────────────────────
# Window rules
# ─────────────────────────────

# ───────── App Launcher ─────────
windowrule = match:title ^(app-launcher)$, float on, center on, size 1200 600, animation slide

# ───────── MASTER QUICKSHELL CONTAINER ─────────
# All widgets now live inside this single, shape-shifting window.
# windowrule = match:title ^(qs-master)$, float on, no_shadow on, no_border on, no_initial_focus on

# --------------------------
# Workspaces / Monitor-Zuweisung
# --------------------------
workspace = 9, monitor:HDMI-A-1
workspace = special, monitor:DP-2
workspace = 1, monitor:DP-2
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2

# --------------------------
# Workspaces / App placement
# --------------------------
windowrule = match:title ^(Clock)$, workspace 9
windowrule = match:class ^(discord-canary|discord|vesktop)$, workspace 9
windowrule = match:class ^(librewolf)$, workspace 3
windowrule = match:class ^(steam)$, workspace 2 silent
windowrule = match:class ^(com\.obsproject\.Studio)$, workspace 5
windowrule = match:class ^(steam_app_\d+)$, workspace 4

# Claude (PWA)
windowrule {
  name = pwa-claude
  match:class = ^(chrome-claude\.ai__-Default)$
  workspace = special:claude silent
  monitor = DP-2
  float = on
  size = 1200 800
  center = on
  no_anim = on
  no_blur = on
}

# WhatsApp (PWA)
windowrule {
  name = pwa-whatsapp
  match:class = ^(chrome-web\.whatsapp\.com__-Default)$
  workspace = special:whatsapp silent
  monitor = DP-2
  float = on
  size = 1000 700
  center = on
  no_anim = on
  no_blur = on
}

# Calculator
windowrule {
  name = calculator
  match:class = ^(org\.gnome\.Calculator)$
  float = on
  size = 500 700
  center = on
  no_anim = on
}

# SoundCloud (PWA)
windowrule {
  name = pwa-soundcloud
  match:class = ^(chrome-soundcloud\.com__-Default)$
  workspace = special:soundcloud silent
  monitor = DP-2
  float = on
  size = 1200 800
  center = on
  no_anim = on
  no_blur = on
}

# Scratchpad Terminal
windowrule {
  name = scratchpad-term
  match:class = ^(ScratchpadTerm)$
  workspace = special:term silent
  float = on
  size = 1400 800
  center = on
  no_anim = on
}

# Pavucontrol
windowrule {
  name = pavucontrol
  match:class = ^(org\.pulseaudio\.pavucontrol)$
  workspace = special:pavu silent
  float = on
  size = 1000 700
  center = on
  no_anim = on
}

# Aonsoku
windowrule {
  name = aonsoku
  match:class = ^(Aonsoku)$
  workspace = special:aonsoku silent
  monitor = DP-2
  float = on
  size = 1200 900
  center = on
  no_anim = on
  no_blur = on
}
