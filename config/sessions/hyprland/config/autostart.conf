exec-once = swww-daemon
exec-once = hypridle
exec-once = playerctld
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = goxlr-daemon
exec-once = systemctl --user enable --now easyeffects
exec-once = ~/.config/hypr/scripts/settings_watcher.sh &
exec-once = ~/.config/hypr/scripts/volume_listener.sh
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'ArcMidnight-Cursors'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/Main.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/TopBar.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/Floating.qml
exec-once = python3 ~/.config/hypr/scripts/quickshell/focustime/focus_daemon.py &


exec-once = steam # launch the system bar
exec-once = kitty --class ScratchpadTerm --title Scratchpad
exec-once = sleep 2 && obs --startreplaybuffer --multi # launch the system bar
exec-once = bash -c "sleep 8 && setsid chromium --app=https://soundcloud.com --class Soundcloud >/dev/null 2>&1 & disown"
exec-once = bash -c "sleep 5 && chromium --profile-directory=Default --app=https://claude.ai & disown"
exec-once = bash -c "sleep 5 && chromium --profile-directory=Default --app=https://web.whatsapp.com & disown"
exec-once = sleep 3 && discord
exec-once = ~/Apps/check_updates.sh
exec-once = sleep 6 && librewolf
exec-once = easyeffects --gapplication-service
exec-once = sleep 7 && kitty --title Clock tty-clock -c -C 6 -s
exec-once = pavucontrol -t 0
exec-once = sleep 5 && flatpak run io.github.victoralvesf.aonsoku


