#  ◈ SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    border_size = 3
    gaps_in = 9
    gaps_out = 15
    float_gaps = 6
    resize_on_border = true
    extend_border_grab_area = 30
    col.active_border = $active_border
    col.inactive_border = $inactive_border
}

decoration {
    rounding = 15
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = true
        size = 10
        passes = 3
        new_optimizations = true
    }
    shadow {
        enabled = true
    }
}

input {
    kb_layout = de
    kb_options = grp:alt_shift_toggle
    kb_variant = 
    kb_model = 
    kb_rules = 
    accel_profile = flat

    touchpad {
        natural_scroll = true
    }
}

misc {
    focus_on_activate = true
    font_family = JetBrains Mono
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

animations {
    enabled = yes
    bezier = myBezier, 0.0, 0.1, 0.0, 1.0
    animation = windows, 1, 3, myBezier, slide
    animation = windowsOut, 1, 5, myBezier, slide
    animation = layers, 1, 5, myBezier, fade
    animation = layersIn, 1, 5, myBezier, fade
    animation = layersOut, 1, 5, myBezier, fade
    animation = fade, 1, 5, myBezier
    animation = workspaces, 1, 5, myBezier, slide
    animation = specialWorkspaceIn, 1, 4, myBezier, slide
    animation = specialWorkspaceOut, 1, 7, myBezier, slide
}
cursor {
    no_hardware_cursors = true
}
